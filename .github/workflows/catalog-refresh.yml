name: Catalog refresh

# Re-scrapes Mercari, re-runs the pipeline, and commits the new seed
# (data/listings_matched.json). The push triggers Render to redeploy.
on:
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch: {}    # ...and a manual "Run workflow" button

permissions:
  contents: write          # allow the job to push the refreshed seed

concurrency:               # never run two refreshes at once
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50   # 15 brands × cap 150 × politeness delay ≈ 30-35 min of scrape
    steps:
      # Pinned to full commit SHAs (semgrep: mutable tags enable supply-chain
      # attacks — a repointed tag runs attacker code with our secrets).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run matcher regression tests   # [AUDIT B2] the moat ships tested or not at all
        run: |
          pip install -q pytest
          python -m pytest -q tests/

      - name: Run pipeline (scrape -> parse -> match -> translate)
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          # TEMPORARY: DeepL monthly quota exhausted. Standby mode = reuse cached
          # translations, leave new items untranslated (UI falls back to JA title),
          # never fail the run. Remove this line when the quota resets.
          TRANSLATION_DISABLED: "1"
        run: |
          python scrape.py
          python parse.py
          python match.py      # classify BEFORE translating…
          python translate.py  # …so junk never burns DeepL quota [AUDIT B]

      - name: Persist history snapshot to Neon   # [AUDIT A2]
        # Sale-velocity dataset: snapshots + lifecycle (gone_at = sold proxy).
        # No DATABASE_URL secret -> silent no-op. Never fails the pipeline.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python history.py

      - name: Send saved-search alert emails   # ['the bot', PO 2026-08-06]
        # Double opt-in alerts: emails the NEW listings matching each confirmed
        # saved search. Missing secrets -> silent no-op. Never fails the pipeline.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: python alerts.py

      - name: Safety check — refuse to wipe the catalog
        # If Mercari blocked the cloud IP, scrape returns ~0 items. Don't commit
        # an empty catalog (that would blank the live site). Fail instead.
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open("data/listings_matched.json", encoding="utf-8"))
          n = d.get("count", 0)
          print("matched listings:", n)
          if n < 50:
              sys.exit(f"Refusing to commit: only {n} listings (scrape likely blocked).")
          PY

      - name: Commit & push if the seed changed
        # [AUDIT A] NEVER textually merge the generated seed. The previous
        # `git pull --rebase -X theirs` interleaved hunks from two seed
        # versions during a race and produced exact-duplicate listings, which
        # then crashed every Render build. Pattern now: save our fresh seed,
        # hard-sync to the remote tip, restore the seed WHOLESALE, commit, push.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp data/listings_matched.json /tmp/seed_new.json
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/seed_new.json data/listings_matched.json
            git add data/listings_matched.json
            if git diff --cached --quiet; then
              echo "No catalog changes — nothing to commit."
              break
            fi
            git commit -m "chore: catalog refresh"
            git push origin HEAD:main && break
            echo "push attempt $attempt failed (remote moved?), retrying..."; sleep 5
          done

      - name: Alert on failure (ntfy.sh)  # [AUDIT D1]
        # A dead cron is invisible: the site keeps serving a stale catalog and
        # nobody notices (June's DeepL outage went weeks undetected). Push a
        # notification on ANY step failure. Setup: add a repo secret NTFY_TOPIC
        # (a private, hard-to-guess topic name) and subscribe to it in the ntfy
        # app / browser at https://ntfy.sh. No secret set -> step is a no-op.
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -n "$NTFY_TOPIC" ]; then
            curl -s \
              -H "Title: Mekke catalog refresh FAILED" \
              -H "Priority: high" \
              -H "Tags: rotating_light" \
              -d "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              "https://ntfy.sh/$NTFY_TOPIC"
          else
            echo "NTFY_TOPIC secret not set — no notification sent."
          fi
