# Brand config — the single place to add/tune a brand. [AUDIT B1]
# Loaded and validated by brands.py (same exports as before: BRANDS, MATCH, MATCH_PRIORITY).
#
# Per brand:
#   display          : name shown in the UI
#   search_keywords  : ALL are searched on Mercari (scrape.py loops over them)
#   exclude          : terms sent server-side to the Mercari query (exclude param)
#   match:
#     strong         : full/unambiguous brand token          -> confidence 0.95
#     weak           : slang/partial token                   -> confidence 0.65
#     negative       : if present, this brand is disqualified
#     Tokens are matched against a normalized title (NFKC, lowercase, no spaces/punct).
#     Tokens starting with "re:" are regexes, evaluated on a SPACED normalized title
#     (NFKC, lowercase, punctuation->space) — use for word-boundary cases like \blgb\b.
#   mercari_brand_names : seller-picked structured brand tags (item_brand.name) that
#     CONFIRM this brand — harvested from real full_item data. Positive signal only.
#   mercari_brand_ids   : Mercari's numeric brand ids (future: brand-id search recall).
#
# priority = check order, most specific first (Junya before Homme Plus before Homme).

# Niche/companion brands we do NOT carry (Y2K avant-garde cluster, dupe-adjacent).
# Sellers name-drop them alongside ours ("Goa LGB", "ifsixwasnine LGB y2k") for reach.
# Rule [PO 2026-08-04]: if any of these appears in a title, a WEAK match is not
# enough -> needs_review. A STRONG hit (full brand name) still wins. If one of
# these brands ever joins the catalog, move it to `brands:` and delete it here.
foreign_brands:
  - "re:\\bgoa\\b"
  - "re:ゴア(?!テックス)"        # Goa katakana — negative lookahead spares GORE-TEX (ゴアテックス)
  - "ifsixwasnine"
  - "イフシックスワズナイン"
  - "14th addiction"
  - "フォーティーンスアディクション"
  - "civarize"
  - "シヴァーライズ"
  - "re:\\bfuga\\b"
  - "フーガ"
  - "re:\\bmidas\\b"
  - "ミダス"
  - "kmrii"
  - "ケムリ"
  - "re:\\broen\\b"
  - "ロエン"
  - "share spirit"
  - "シェアスピリット"

priority:
  - junya_watanabe
  - cdg_homme_plus
  - cdg_homme_deux
  - cdg_shirt
  - cdg_homme
  - undercover
  - number_nine
  - lgb
  - tornado_mart
  - pleats_please
  - yohji_yamamoto
  - kapital
  - mastermind
  - miu_miu
  - ann_demeulemeester

brands:
  # --- CdG / Junya (menswear lines) ---
  junya_watanabe:
    display: Junya Watanabe MAN
    search_keywords: ["ジュンヤワタナベマン", "JUNYA WATANABE MAN"]
    exclude: ["レディース", "ウィメンズ", "women"]
    match:
      strong: ["ジュンヤワタナベマン", "JUNYA WATANABE MAN", "JUNYA WATANABE", "ジュンヤワタナベ",
               "JYUNYA WATANABE"]  # common romaji misspelling seen in real data
      weak: ["ジュンヤ", "JUNYA", "JYUNYA"]
      negative: []
    mercari_brand_names: ["JUNYA WATANABE MAN", "JUNYA WATANABE COMME des GARCONS",
                          "eYe COMME des GARCONS JUNYA WATANABE MAN", "EYE JUNYA WATANABE MAN"]

  cdg_homme_plus:
    display: Comme des Garçons Homme Plus
    search_keywords: ["コムデギャルソンオムプリュス", "オムプリュス", "HOMME PLUS"]
    exclude: ["オムドゥ", "HOMME DEUX", "シャツ", "SHIRT", "ジュンヤ"]
    match:
      strong: ["コムデギャルソンオムプリュス", "COMME des GARCONS HOMME PLUS", "HOMME PLUS", "オムプリュス",
               "HOMME PULUS"]  # 'PULUS' = common romaji misspelling of PLUS (real data)
      weak: ["オムプラス", "HOMME+"]
      negative: ["ジュンヤ", "JUNYA", "オムドゥ", "HOMME DEUX"]
    mercari_brand_names: []

  cdg_homme_deux:
    display: Comme des Garçons Homme Deux
    search_keywords: ["コムデギャルソンオムドゥ", "HOMME DEUX"]
    exclude: ["オムプリュス", "ジュンヤ"]
    match:
      strong: ["コムデギャルソンオムドゥ", "COMME des GARCONS HOMME DEUX", "オムドゥ", "HOMME DEUX"]
      weak: []
      # mutual-negative symmetry with Homme Plus: a title citing both lines is ambiguous
      negative: ["オムプリュス", "HOMME PLUS", "ジュンヤ", "JUNYA"]
    mercari_brand_names: ["COMME des GARCONS HOMME DEUX"]  # canonique — à confirmer par récolte

  cdg_shirt:
    display: Comme des Garçons SHIRT
    search_keywords: ["コムデギャルソンシャツ", "COMME des GARCONS SHIRT"]
    exclude: ["ジュンヤ"]
    match:
      # ⚠️ 'シャツ'/'SHIRT' seul = le mot générique « chemise » — UNIQUEMENT les composés complets.
      # Katakana en regex-espacée GLUÉE : « コムデギャルソン シャツ » (mainline + vêtement) reste dehors.
      strong: ["re:コムデギャルソンシャツ", "COMME des GARCONS SHIRT", "COMME des GARÇONS SHIRT",
               "CDG SHIRT"]
      weak: []
      negative: ["ジュンヤ", "JUNYA"]
    mercari_brand_names: ["COMME des GARCONS SHIRT"]  # vérifié live 2026-08-04 (item m92540853507)

  cdg_homme:
    display: Comme des Garçons Homme
    search_keywords: ["コムデギャルソンオム", "COMME des GARCONS HOMME"]
    exclude: ["オムプリュス", "HOMME PLUS", "オムドゥ", "HOMME DEUX", "シャツ", "SHIRT", "ジュンヤ"]
    match:
      strong: ["コムデギャルソンオム", "COMME des GARCONS HOMME"]
      weak: ["ギャルソンオム"]
      negative: ["オムプリュス", "HOMME PLUS", "HOMME PULUS", "オムドゥ", "HOMME DEUX", "ジュンヤ", "JUNYA"]
    mercari_brand_names: []

  # --- Ura-Harajuku / archive ---
  undercover:
    display: Undercover
    search_keywords: ["アンダーカバー", "UNDERCOVER"]
    exclude: []
    match:
      strong: ["アンダーカバー", "UNDERCOVER"]  # substring also catches UNDERCOVERISM etc.
      weak: ["アンカバ"]
      negative: []
    mercari_brand_names: []

  number_nine:
    display: Number (Nine)
    search_keywords: ["ナンバーナイン", "NUMBER NINE"]
    exclude: ["ソロイスト", "TheSoloist"]
    match:
      strong: ["ナンバーナイン", "NUMBER NINE"]  # "NUMBER (N)INE" normalizes to 'numbernine' too
      weak: ["ナンバナイン"]
      negative: ["ソロイスト", "THE SOLOIST", "TAKAHIROMIYASHITA"]  # his later label
    mercari_brand_names: []

  # --- Y2K Japanese ---
  lgb:
    display: LGB (Le Grand Bleu)
    search_keywords: ["ルグランブルー", "Le Grand Bleu"]
    exclude: []
    match:
      strong: ["ルグランブルー", "Le Grand Bleu"]
      # bare 'lgb' as substring would catch 'lgbt' — word-boundary regex instead.
      # \bl ?g ?b\b also catches the dotted form "L.G.B." (dots become spaces
      # in the spaced normalization) — real inventory found by Paul 2026-08-04.
      weak: ["エルジービー", "re:\\bl ?g ?b\\b"]
      negative: []
    mercari_brand_names: ["LGB", "L.G.B."]  # Mercari has BOTH brand entries (ids 4371 / 3848)
    mercari_brand_ids: [4371, 3848]

  tornado_mart:
    display: Tornado Mart
    search_keywords: ["トルネードマート", "TORNADO MART"]
    exclude: []
    match:
      strong: ["トルネードマート", "TORNADO MART"]
      weak: []  # bare 'トルネード'/'tornado' too generic
      negative: []
    mercari_brand_names: []

  # --- Issey Miyake (womenswear line) ---
  pleats_please:
    display: Pleats Please Issey Miyake
    search_keywords: ["プリーツプリーズ", "PLEATS PLEASE"]
    exclude: ["オムプリッセ", "HOMME PLISSE"]  # exclude the MEN's pleats line
    match:
      strong: ["プリーツプリーズ", "PLEATS PLEASE"]
      weak: []
      negative: ["オムプリッセ", "HOMME PLISSE", "プリッセ"]
    mercari_brand_names: []

  # --- Batch 2026-08-05 (PO request) ---
  yohji_yamamoto:
    display: Yohji Yamamoto
    search_keywords: ["ヨウジヤマモト", "YOHJI YAMAMOTO"]
    exclude: ["ワイスリー", "Y-3"]
    match:
      strong: ["ヨウジヤマモト", "YOHJI YAMAMOTO"]
      weak: ["ヨウジ"]
      # Y-3 (adidas, mass) et Y's (ligne séparée) polluent — exclus du mainline/Pour Homme
      negative: ["ワイスリー", "Y-3", "Y3", "ワイズ"]
    mercari_brand_names: ["Yohji Yamamoto", "Yohji Yamamoto POUR HOMME"]  # à confirmer par récolte

  kapital:
    display: Kapital
    search_keywords: ["キャピタル", "KAPITAL"]
    exclude: []
    match:
      # 'KAPITAL' avec K = distinctif (pas le mot anglais 'capital')
      strong: ["キャピタル", "KAPITAL"]
      weak: []
      negative: []
    mercari_brand_names: ["KAPITAL"]  # à confirmer par récolte

  mastermind:
    display: Mastermind Japan
    search_keywords: ["マスターマインド", "mastermind JAPAN"]
    exclude: []
    match:
      strong: ["マスターマインド", "MASTERMIND"]
      weak: []
      negative: []
    mercari_brand_names: ["mastermind JAPAN", "mastermind"]  # à confirmer par récolte

  miu_miu:
    display: Miu Miu
    search_keywords: ["ミュウミュウ", "miumiu"]
    exclude: []
    match:
      strong: ["ミュウミュウ", "MIU MIU", "MIUMIU"]
      weak: []
      negative: []
    mercari_brand_names: ["miumiu"]  # à confirmer par récolte

  ann_demeulemeester:
    display: Ann Demeulemeester
    search_keywords: ["アンドゥムルメステール", "ANN DEMEULEMEESTER"]
    exclude: []
    match:
      strong: ["アンドゥムルメステール", "ANN DEMEULEMEESTER"]
      weak: ["ドゥムルメステール", "DEMEULEMEESTER"]  # orthographes partielles fréquentes
      negative: []
    mercari_brand_names: ["Ann Demeulemeester"]  # à confirmer par récolte

  # TODO: add more brands here — one YAML block, no code change needed.
  # Candidates: Issey Miyake mainline, Visvim, Margiela, IF SIX WAS NINE, Goa (cf. foreign_brands)…
